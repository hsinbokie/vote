<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>大螢幕控制台</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f8ff; margin: 0; padding: 50px; }
        .screen { display: none; } /* 隱藏所有頁面 */
        .active-screen { display: block; } /* 只顯示加上 active 的頁面 */
        
        #questionTitle { font-size: 50px; margin-bottom: 30px; }
        .options { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .opt-box { width: 40%; padding: 30px; font-size: 30px; border-radius: 10px; color: white; font-weight: bold; }
        .bg-A { background-color: #e21b3c; } .bg-B { background-color: #1368ce; }
        .bg-C { background-color: #d89e00; } .bg-D { background-color: #26890c; }
        
        #timerDisplay { font-size: 80px; color: #ff5c5c; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .control-btn { padding: 15px 30px; font-size: 24px; cursor: pointer; background: #333; color: white; border: none; border-radius: 10px; margin: 10px; }
        #leaderboard { font-size: 30px; background: white; padding: 30px; border-radius: 15px; display: inline-block; text-align: left; min-width: 400px; margin-bottom: 20px;}
        .player-count-display { font-size: 20px; color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="startScreen" class="screen active-screen">
        <h1 style="font-size: 60px; margin-top: 100px;">準備好開始搶答了嗎？</h1>
        <div class="player-count-display">目前連線人數: <span class="playerCount">0</span></div>
        <button class="control-btn" onclick="socket.emit('nextQuestion')" style="background-color: #4CAF50;">開始第一題</button>
        <button class="control-btn" onclick="resetGame()" style="background-color: #f44336;">重置遊戲</button>
    </div>

    <div id="questionScreen" class="screen">
        <div class="player-count-display">目前連線人數: <span class="playerCount">0</span></div>
        <h2 id="questionTitle">題目載入中...</h2>
        <div id="timerDisplay">5.00</div>
        <div class="options" id="optionsContainer"></div>
    </div>

    <div id="resultsScreen" class="screen">
        <h1 style="color: #4CAF50; font-size: 50px;">正確答案是：<span id="correctAnswer"></span></h1>
        <div id="leaderboard"></div><br>
        <button class="control-btn" onclick="socket.emit('nextQuestion')" style="background-color: #ff9800; font-size: 30px;">進入下一題</button>
        <button class="control-btn" onclick="resetGame()" style="background-color: #f44336;">重置遊戲</button>
    </div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let visualTimer; // 前端視覺倒數計時器

    // 切換畫面的小工具
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    socket.on('updatePlayers', (count) => {
        document.querySelectorAll('.playerCount').forEach(el => el.innerText = count);
    });

    socket.on('loadQuestion', (question) => {
        showScreen('questionScreen'); // 切換到題目頁
        
        document.getElementById('questionTitle').innerText = question.title;
        document.getElementById('timerDisplay').innerText = '5.00';
        
        const container = document.getElementById('optionsContainer');
        container.innerHTML = `
            <div class="opt-box bg-A">A: ${question.options.A}</div>
            <div class="opt-box bg-B">B: ${question.options.B}</div>
            <div class="opt-box bg-C">C: ${question.options.C}</div>
            <div class="opt-box bg-D">D: ${question.options.D}</div>
        `;

        // 前端自己跑流暢的倒數動畫 (每 50 毫秒更新一次畫面)
        let timeLeft = 5.00;
        clearInterval(visualTimer);
        visualTimer = setInterval(() => {
            timeLeft -= 0.05;
            if (timeLeft <= 0) {
                timeLeft = 0;
                clearInterval(visualTimer);
            }
            document.getElementById('timerDisplay').innerText = timeLeft.toFixed(2); // 顯示到小數點後兩位
        }, 50);
    });

    socket.on('showResults', (data) => {
        showScreen('resultsScreen'); // 切換到排名頁
        document.getElementById('correctAnswer').innerText = data.answer;
        
        const lbContainer = document.getElementById('leaderboard');
        lbContainer.innerHTML = '<h3>🏆 即時總積分排行榜 🏆</h3>';
        data.ranking.forEach((player, index) => {
            lbContainer.innerHTML += `<p>第 ${index + 1} 名: ${player.name} <span style="color: #ff5c5c; font-weight: bold;">(${player.score} 分)</span></p>`;
        });
    });

    socket.on('gameOver', () => {
        alert('題目已經全部出完囉！');
    });

    function resetGame() {
        if (confirm('確定要重置遊戲嗎？所有人的分數都會歸零！')) {
            socket.emit('resetGame');
        }
    }

    socket.on('gameReset', () => {
        clearInterval(visualTimer);
        showScreen('startScreen'); // 回到準備畫面
    });
</script>
</body>
</html>

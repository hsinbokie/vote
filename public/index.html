<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚禮互動問答</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #fdfbfb; }
        .container { max-width: 400px; margin: 0 auto; }
        button { padding: 15px; font-size: 20px; margin: 10px 0; width: 100%; border-radius: 10px; border: none; color: white; cursor: pointer; }
        .btn-A { background-color: #e21b3c; } .btn-B { background-color: #1368ce; }
        .btn-C { background-color: #d89e00; } .btn-D { background-color: #26890c; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input { padding: 12px; font-size: 18px; width: 90%; margin-bottom: 20px; text-align: center; }
        .hidden { display: none; }
        #statusMessage { font-size: 20px; color: #555; margin-top: 50px; }
    </style>
</head>
<body>
<div class="container">
    <div id="loginSection">
        <h2>輸入你的名字加入遊戲</h2>
        <input type="text" id="username" placeholder="例如：新郎大學同學-阿滴">
        <button onclick="joinGame()" style="background-color: #333;">進入房間</button>
    </div>

    <div id="gameSection" class="hidden">
        <h2 id="statusMessage">等待主持人開始...</h2>
        <div id="optionsContainer" class="hidden">
            <button class="btn-A" onclick="vote('A')">A</button>
            <button class="btn-B" onclick="vote('B')">B</button>
            <button class="btn-C" onclick="vote('C')">C</button>
            <button class="btn-D" onclick="vote('D')">D</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
    let clientStartTime = 0; // 新增：手機端專屬碼表

    function joinGame() {
        const user = document.getElementById('username').value;
        if (!user) return alert('請輸入名字！');
        socket.emit('joinGame', user);
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('gameSection').style.display = 'block';
    }
    
    function vote(option) {
        // 新增：按下按鈕的瞬間，計算精準反應時間 (毫秒)
        let reactionTime = Date.now() - clientStartTime; 
        
        // 將答案和精準時間一起打包送給伺服器
        socket.emit('submitVote', { option: option, reactionTime: reactionTime });
        
        document.querySelectorAll('#optionsContainer button').forEach(b => b.disabled = true);
        document.getElementById('statusMessage').innerText = '已送出答案！等待開獎...';
        document.getElementById('statusMessage').style.display = 'block';
        document.getElementById('optionsContainer').style.display = 'none';
    }

    socket.on('loadQuestion', () => {
        // 新增：題目出現的瞬間，啟動手機端碼表
        clientStartTime = Date.now(); 
        
        document.getElementById('statusMessage').style.display = 'none';
        document.getElementById('optionsContainer').style.display = 'block';
        document.querySelectorAll('#optionsContainer button').forEach(b => b.disabled = false);
    });

    socket.on('showResults', () => {
        document.getElementById('statusMessage').innerText = '時間到！請看大螢幕排名！';
        document.getElementById('statusMessage').style.display = 'block';
        document.getElementById('optionsContainer').style.display = 'none';
    });

    socket.on('gameReset', () => {
        document.getElementById('statusMessage').innerText = '遊戲已重置！等待主持人開始...';
        document.getElementById('statusMessage').style.display = 'block';
        document.getElementById('optionsContainer').style.display = 'none';
    });
</script>
</body>
</html>
